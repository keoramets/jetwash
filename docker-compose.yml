services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jetwash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - jetwash_postgres:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jetwash?schema=public
volumes:
  jetwash_postgres:
