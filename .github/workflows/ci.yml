name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only. The real values are set on the host (Railway), never in git.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jetwash?schema=public
      NEXTAUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
