name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time only. On Netlify, URL is set automatically; this keeps canonical links valid in CI.
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      # The static site Netlify publishes, with both forms in it for Netlify Forms to find
      - run: test -f out/index.html && grep -q 'name="contact"' out/contact.html && grep -q 'name="quote-request"' out/request-quote.html && echo "site ok"
      - run: npm audit --omit=dev --audit-level=high
